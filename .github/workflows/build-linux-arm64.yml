name: Linux arm64

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build \
            libzstd-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libudev-dev libdbus-1-dev \
            libgl-dev libvulkan-dev

      - name: Configure
        run: tools/build_linux.sh --configure

      # A full build requires a copy of the game (R2_DOL); build the recompiler
      # tool to verify the toolchain and CMake setup work on AArch64.
      - name: Build r2recomp
        run: cmake --build build/linux --target r2recomp
